name: Daily competitor intelligence collection

on:
  schedule:
    - cron: '15 23 * * *' # 07:15 China Standard Time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect public official sources
        run: python scripts/collector.py
      - name: Save collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Daily intelligence collection $(date -u +%F)"
            git push
          else
            echo 'No data changes to commit.'
          fi
